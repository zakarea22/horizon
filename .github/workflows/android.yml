name: Android APK

# Builds the game as a native library for arm64 Android (crates/horizon-android) and packs it with the
# launcher app in android/ into a debug-signed APK, uploaded as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [android-port]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the native library
        run: |
          # The runner image ships the Android NDK at ANDROID_NDK_ROOT; cargo-ndk reads ANDROID_NDK_HOME first.
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}"
          echo "NDK: $ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs \
            build --profile fast -p horizon-android
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
